<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="소설 리더">
<meta name="theme-color" content="#9b6f2f">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>소설 리더</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div id="progress-bar"></div>
<div id="brightness-veil"></div>

<!-- 상단 툴바 -->
<div id="toolbar">
  <button class="icon-btn" id="btn-home" aria-label="서재">
    <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/></svg>
  </button>
  <span id="book-title"></span>
  <button class="icon-btn" id="btn-bookmark" aria-label="북마크">
    <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
  </button>
  <button class="icon-btn" id="btn-menu" aria-label="메뉴">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</div>

<!-- 서재 -->
<div id="library">
  <div class="lib-header">
    <div class="lib-header-row">
      <div class="lib-logo">
        <div class="lib-logo-mark">
          <svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h6v16H5a1 1 0 0 1-1-1V5zM20 5a1 1 0 0 0-1-1h-6v16h6a1 1 0 0 0 1-1V5z"/></svg>
        </div>
        <span class="lib-title">소설 리더</span>
      </div>
      <button class="add-btn" id="add-btn-top">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> 가져오기
      </button>
    </div>
    <div class="lib-sub">광고 없이, 온전히 읽기에 집중하는 공간</div>
  </div>

  <div id="continue-card">
    <div class="cc-deco"><svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h6v16H5a1 1 0 0 1-1-1V5zM20 5a1 1 0 0 0-1-1h-6v16h6a1 1 0 0 0 1-1V5z"/></svg></div>
    <div class="cc-label">이어서 읽기</div>
    <div class="cc-title" id="cc-title"></div>
    <div class="cc-chapter" id="cc-chapter"></div>
    <div class="cc-bar"><div class="cc-fill" id="cc-fill"></div></div>
    <div class="cc-footer"><span class="cc-pct" id="cc-pct"></span><span class="cc-time" id="cc-time"></span></div>
  </div>

  <div class="section-label"><span>내 서재</span></div>
  <div class="library-tools">
    <label class="sr-only" for="library-search">서재 검색</label>
    <input id="library-search" type="search" placeholder="작품명 검색" enterkeyhint="search" autocomplete="off">
    <label class="sr-only" for="library-sort">서재 정렬</label>
    <select id="library-sort" aria-label="서재 정렬">
      <option value="recent">최근 읽은 순</option>
      <option value="title">작품명 순</option>
      <option value="progress">진행률 순</option>
    </select>
  </div>
  <div id="book-grid"></div>
  <div id="empty-state">
    <div class="es-icon">📚</div>
    <div class="es-title">서재가 비어있어요</div>
    <div class="es-desc">구글 드라이브 등에서 받은<br>.txt 소설 파일을 추가해보세요</div>
    <button class="add-btn" id="add-btn-empty" style="font-size:14px;padding:11px 22px;">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> 첫 파일 추가하기
    </button>
  </div>
</div>

<!-- 읽기 화면 -->
<div id="reader">
  <div id="reader-content"><div id="text-display"></div></div>
</div>

<!-- 하단 상태바 -->
<div id="status-bar">
  <div class="reader-progress-info">
    <span id="chapter-now"></span>
    <span id="pct-now">0%</span>
  </div>
  <div class="reader-progress-track"><div id="reader-progress-fill"></div></div>
  <div class="reader-actions">
    <button class="reader-action" data-reader-tab="toc">목차</button>
    <button class="reader-action" data-reader-tab="bookmarks">북마크</button>
    <button class="reader-action" data-reader-tab="settings">보기 설정</button>
  </div>
</div>

<!-- 자동스크롤 표시 -->
<div id="autoscroll-ind">
  <span>자동 스크롤</span>
  <div class="as-spd">
    <button class="as-mini" id="as-slower">−</button>
    <span id="as-speed">3</span>
    <button class="as-mini" id="as-faster">+</button>
  </div>
  <button class="as-mini" id="as-stop" style="background:rgba(255,255,255,0.3)">✕</button>
</div>

<!-- 시트 -->
<div id="overlay"></div>
<div id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-tabs">
    <button class="sheet-tab active" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      설정
    </button>
    <button class="sheet-tab" data-tab="toc">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      목차
    </button>
    <button class="sheet-tab" data-tab="bookmarks">
      <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
      북마크
    </button>
    <button class="sheet-tab" data-tab="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      검색
    </button>
  </div>

  <!-- 설정 패널 -->
  <div class="tab-panel active" id="panel-settings">
    <div class="set-block">
      <div class="set-block-title">글자</div>
      <div class="set-row">
        <span class="set-label">크기</span>
        <div class="stepper"><button class="step-btn" data-act="font-">−</button><span class="step-val" id="v-font">19</span><button class="step-btn" data-act="font+">+</button></div>
      </div>
      <div class="set-row">
        <span class="set-label">줄 간격</span>
        <div class="stepper"><button class="step-btn" data-act="line-">−</button><span class="step-val" id="v-line">2.0</span><button class="step-btn" data-act="line+">+</button></div>
      </div>
      <div class="set-row">
        <span class="set-label">좌우 여백</span>
        <div class="stepper"><button class="step-btn" data-act="pad-">−</button><span class="step-val" id="v-pad">16</span><button class="step-btn" data-act="pad+">+</button></div>
      </div>
      <div class="set-row">
        <span class="set-label">문단 간격</span>
        <div class="stepper"><button class="step-btn" data-act="gap-">−</button><span class="step-val" id="v-gap">0.9</span><button class="step-btn" data-act="gap+">+</button></div>
      </div>
    </div>

    <div class="set-block">
      <div class="set-block-title">글꼴</div>
      <div class="pill-row">
        <button class="pill font-serif" data-font="serif">명조체</button>
        <button class="pill font-sans" data-font="sans">고딕체</button>
      </div>
      <div class="set-row" style="margin-top:6px">
        <span class="set-label">굵기</span>
        <div class="pill-row">
          <button class="pill" data-weight="400">보통</button>
          <button class="pill" data-weight="700">굵게</button>
        </div>
      </div>
    </div>

    <div class="set-block">
      <div class="set-block-title">테마</div>
      <div class="theme-grid">
        <button class="theme-chip tc-sepia" data-theme="sepia"></button>
        <button class="theme-chip tc-light" data-theme="light"></button>
        <button class="theme-chip tc-dark" data-theme="dark"></button>
        <button class="theme-chip tc-night" data-theme="night"></button>
        <button class="theme-chip tc-green" data-theme="green"></button>
      </div>
    </div>

    <div class="set-block">
      <div class="set-block-title">밝기</div>
      <div class="slider-wrap">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.6 5.6L4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4"/></svg>
        <input type="range" id="brightness-slider" min="0" max="70" value="0">
      </div>
    </div>

    <div class="set-block">
      <div class="set-block-title">읽기 도구</div>
      <div class="set-row">
        <span class="set-label">자동 스크롤</span>
        <button class="pill" id="autoscroll-toggle">시작</button>
      </div>
    </div>
  </div>

  <!-- 목차 패널 -->
  <div class="tab-panel" id="panel-toc"><div id="toc-list"></div></div>

  <!-- 북마크 패널 -->
  <div class="tab-panel" id="panel-bookmarks"><div id="bookmark-list"></div></div>

  <!-- 검색 패널 -->
  <div class="tab-panel" id="panel-search">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="본문에서 검색..." enterkeyhint="search">
      <button class="search-go" id="search-go"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    </div>
    <div id="search-count"></div>
    <div id="search-results"></div>
  </div>
</div>

<input type="file" id="file-input" accept=".txt,text/plain" multiple style="display:none">
<div id="loading"><div class="spinner"></div><span id="loading-msg">불러오는 중...</span></div>
<div id="toast"></div>

<script defer src="./js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="소설 리더">
<meta name="theme-color" content="#9b6f2f">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>소설 리더</title>
<style>
:root {
  --bg: #f3ebdd;
  --bg-grad: #efe5d3;
  --text: #2a2018;
  --accent: #9b6f2f;
  --accent-soft: #b88a4a;
  --surface: #ece1cf;
  --surface-2: #e3d6bf;
  --border: #d4c2a0;
  --muted: #8f7a60;
  --shadow: rgba(60, 40, 15, 0.16);
  --font-size: 19px;
  --line-height: 2.0;
  --letter-spacing: 0.01em;
  --side-pad: 16px;
  --para-gap: 0.85em;
  --body-font: 'Noto Serif', 'Nanum Myeongjo', 'Batang', serif;
  --font-weight: 400;
  --ui-font: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
}
[data-theme="light"] {
  --bg: #fbfaf8; --bg-grad: #f6f5f2; --text: #1c1c1c;
  --accent: #486582; --accent-soft: #6a8aa8; --surface: #f4f2ee; --surface-2: #eceae5;
  --border: #ddd9d2; --muted: #8a8a8a; --shadow: rgba(0,0,0,0.1);
}
[data-theme="dark"] {
  --bg: #1d1b18; --bg-grad: #232019; --text: #cabaa4; --accent: #c9a55c;
  --accent-soft: #d8bd7e; --surface: #28241e; --surface-2: #322d25;
  --border: #3a342b; --muted: #756857; --shadow: rgba(0,0,0,0.5);
}
[data-theme="night"] {
  --bg: #000000; --bg-grad: #0a0a0a; --text: #9a9285; --accent: #b89a5a;
  --accent-soft: #c8ab6c; --surface: #121110; --surface-2: #1a1815;
  --border: #262320; --muted: #5a5448; --shadow: rgba(0,0,0,0.7);
}
[data-theme="green"] {
  --bg: #e3ead9; --bg-grad: #dce4cf; --text: #2c3320; --accent: #5d7239;
  --accent-soft: #768c4f; --surface: #d8e1ca; --surface-2: #cdd8bb;
  --border: #bcc9a5; --muted: #76805f; --shadow: rgba(40,50,20,0.14);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: auto; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--ui-font);
  background: var(--bg);
  background-image: linear-gradient(170deg, var(--bg) 0%, var(--bg-grad) 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  transition: background-color 0.5s ease, color 0.5s ease;
  overscroll-behavior-y: contain;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: var(--ui-font); cursor: pointer; color: inherit; }

/* ════════ 진행 바 ════════ */
#progress-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 2.5px;
  background: linear-gradient(90deg, var(--accent), var(--accent-soft));
  transform-origin: left; transform: scaleX(0);
  transition: transform 0.12s ease; z-index: 350;
}

/* ════════ 상단 툴바 ════════ */
#toolbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: none; align-items: center; gap: 4px;
  padding: calc(env(safe-area-inset-top) + 9px) 8px 9px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease;
}
#toolbar.show { display: flex; }
#toolbar.hide { transform: translateY(-115%); opacity: 0; }
#book-title {
  flex: 1; font-size: 14.5px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: -0.01em; padding: 0 4px;
}
.icon-btn {
  width: 40px; height: 40px; border: none; background: transparent;
  border-radius: 11px; display: flex; align-items: center; justify-content: center;
  transition: background 0.18s, transform 0.1s; flex-shrink: 0;
}
.icon-btn:active { background: var(--surface-2); transform: scale(0.92); }
.icon-btn svg { width: 21px; height: 21px; stroke: var(--text); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.bookmarked svg { fill: var(--accent); stroke: var(--accent); }

/* ════════ 서재 화면 ════════ */
#library {
  max-width: 920px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 28px) 20px 60px;
  animation: fadeUp 0.6s ease;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
.lib-header { margin-bottom: 28px; }
.lib-logo {
  display: flex; align-items: center; gap: 11px; margin-bottom: 6px;
}
.lib-logo-mark {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(140deg, var(--accent), var(--accent-soft));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent);
}
.lib-logo-mark svg { width: 20px; height: 20px; stroke: var(--bg); fill: none; stroke-width: 2; }
.lib-title { font-size: 25px; font-weight: 800; letter-spacing: -0.03em; color: var(--text); }
.lib-sub { font-size: 13.5px; color: var(--muted); margin-left: 49px; letter-spacing: 0.01em; }

/* 이어읽기 카드 */
#continue-card {
  display: none; margin-bottom: 26px; padding: 20px;
  border-radius: 18px; cursor: pointer; position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 100%);
  box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 35%, transparent);
  transition: transform 0.15s; -webkit-tap-highlight-color: transparent;
}
#continue-card:active { transform: scale(0.985); }
#continue-card .cc-label {
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: color-mix(in srgb, #fff 80%, transparent); margin-bottom: 7px;
}
#continue-card .cc-title {
  font-size: 19px; font-weight: 700; color: #fff; margin-bottom: 14px;
  letter-spacing: -0.01em; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
#continue-card .cc-bar {
  height: 5px; border-radius: 3px; background: color-mix(in srgb, #fff 28%, transparent); overflow: hidden;
}
#continue-card .cc-fill { height: 100%; border-radius: 3px; background: #fff; transition: width 0.4s; }
#continue-card .cc-pct { font-size: 12.5px; color: #fff; font-weight: 600; margin-top: 8px; opacity: 0.95; }
.cc-deco { position: absolute; right: -20px; top: -20px; opacity: 0.13; }
.cc-deco svg { width: 130px; height: 130px; stroke: #fff; fill: none; stroke-width: 1; }

.section-label {
  font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between;
}
.add-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
  border: 1.5px solid var(--border); background: var(--surface); border-radius: 20px;
  font-size: 13px; font-weight: 600; color: var(--accent); transition: all 0.18s; text-transform: none; letter-spacing: 0;
}
.add-btn:active { background: var(--surface-2); transform: scale(0.95); }
.add-btn svg { width: 15px; height: 15px; stroke: var(--accent); fill: none; stroke-width: 2.2; }

/* 책 그리드 */
#book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.book-card {
  position: relative; border-radius: 15px; overflow: hidden; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border);
  transition: transform 0.15s, box-shadow 0.2s; -webkit-tap-highlight-color: transparent;
}
.book-card:active { transform: scale(0.96); }
.book-cover {
  aspect-ratio: 3 / 4; padding: 16px 14px; display: flex; flex-direction: column;
  justify-content: space-between; position: relative;
  background: linear-gradient(150deg, var(--surface-2), var(--surface));
  border-bottom: 1px solid var(--border);
}
.book-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(var(--accent), var(--accent-soft)); }
.book-cover-title {
  font-family: var(--body-font); font-size: 15px; font-weight: 700; line-height: 1.4; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; padding-left: 6px;
}
.book-cover-icon { align-self: flex-end; opacity: 0.4; }
.book-cover-icon svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.5; }
.book-info { padding: 10px 12px 12px; }
.book-meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.book-prog-bar { height: 3px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.book-prog-fill { height: 100%; border-radius: 2px; background: var(--accent); }
.book-del {
  position: absolute; top: 7px; right: 7px; width: 27px; height: 27px; border-radius: 50%;
  background: color-mix(in srgb, var(--bg) 75%, transparent); backdrop-filter: blur(4px);
  border: none; display: none; align-items: center; justify-content: center; z-index: 3;
}
.book-card.editing .book-del { display: flex; }
.book-del svg { width: 14px; height: 14px; stroke: #c0392b; fill: none; stroke-width: 2.4; }

#empty-state { text-align: center; padding: 56px 20px; color: var(--muted); }
#empty-state .es-icon { font-size: 46px; margin-bottom: 16px; opacity: 0.5; }
#empty-state .es-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
#empty-state .es-desc { font-size: 13.5px; line-height: 1.7; margin-bottom: 24px; }

/* ════════ 읽기 화면 ════════ */
#reader { display: none; max-width: 720px; margin: 0 auto; }
#reader.show { display: block; }
#reader-content {
  padding: calc(env(safe-area-inset-top) + 64px) var(--side-pad) 96px;
}
#text-display p {
  font-family: var(--body-font);
  font-size: var(--font-size); line-height: var(--line-height); letter-spacing: var(--letter-spacing);
  font-weight: var(--font-weight);
  word-break: keep-all; overflow-wrap: break-word; margin-bottom: var(--para-gap); text-indent: 1em;
  content-visibility: auto; contain-intrinsic-size: auto 3em;
  transition: background 0.3s;
}
#text-display p.blank { height: var(--para-gap); margin: 0; content-visibility: visible; }
#text-display p.chapter {
  font-weight: 700; font-size: calc(var(--font-size) * 1.15); text-indent: 0;
  margin: 1.6em 0 0.9em; color: var(--accent); letter-spacing: 0.01em; scroll-margin-top: 70px;
}
#text-display p.search-hit { background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 4px; }
#text-display mark { background: color-mix(in srgb, var(--accent) 38%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
#text-display p[id] { scroll-margin-top: 70px; }

/* ════════ 하단 상태바 ════════ */
#status-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; display: none;
  align-items: center; justify-content: space-between;
  padding: 9px 18px calc(env(safe-area-inset-bottom) + 9px);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease;
}
#status-bar.show { display: flex; }
#status-bar.hide { transform: translateY(115%); opacity: 0; }
#chapter-now { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
#pct-now { font-size: 12.5px; font-weight: 700; color: var(--accent); letter-spacing: 0.03em; }

/* ════════ 자동스크롤 표시 ════════ */
#autoscroll-ind {
  position: fixed; bottom: calc(env(safe-area-inset-bottom) + 64px); left: 50%; transform: translateX(-50%);
  z-index: 190; display: none; align-items: center; gap: 9px;
  padding: 9px 16px; border-radius: 22px; background: var(--accent); color: #fff;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 45%, transparent); font-size: 13px; font-weight: 600;
}
#autoscroll-ind.show { display: flex; animation: fadeUp 0.3s ease; }
#autoscroll-ind .as-spd { display: flex; gap: 5px; align-items: center; }
.as-mini { width: 24px; height: 24px; border-radius: 50%; background: color-mix(in srgb, #fff 22%, transparent); border: none; color: #fff; font-size: 15px; display: flex; align-items: center; justify-content: center; line-height: 1; }

/* ════════ 오버레이 + 시트 ════════ */
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 240; display: none; backdrop-filter: blur(2px); }
#overlay.show { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

#sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 250;
  background: var(--surface); border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--border);
  box-shadow: 0 -10px 44px var(--shadow);
  transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32,0.72,0,1);
  max-height: 82vh; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}
#sheet.open { transform: translateY(0); }
.sheet-handle { width: 38px; height: 4px; background: var(--border); border-radius: 2px; margin: 11px auto 4px; flex-shrink: 0; }

/* 탭 */
.sheet-tabs { display: flex; padding: 8px 12px 0; gap: 2px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.sheet-tab {
  flex: 1; padding: 11px 4px 13px; border: none; background: transparent; font-size: 12.5px; font-weight: 600;
  color: var(--muted); position: relative; transition: color 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.sheet-tab svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.sheet-tab.active { color: var(--accent); }
.sheet-tab.active::after { content: ''; position: absolute; bottom: -1px; left: 18%; right: 18%; height: 2.5px; background: var(--accent); border-radius: 2px; }

.tab-panel { display: none; overflow-y: auto; padding: 18px 20px 28px; -webkit-overflow-scrolling: touch; }
.tab-panel.active { display: block; }

/* 설정 탭 */
.set-block { margin-bottom: 22px; }
.set-block:last-child { margin-bottom: 0; }
.set-block-title { font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 13px; }
.set-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; }
.set-label { font-size: 14.5px; }
.stepper { display: flex; align-items: center; gap: 11px; }
.step-btn {
  width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border); background: var(--bg);
  font-size: 21px; line-height: 1; display: flex; align-items: center; justify-content: center; transition: background 0.15s; font-weight: 300;
}
.step-btn:active { background: var(--surface-2); }
.step-val { min-width: 42px; text-align: center; font-size: 14px; font-weight: 700; color: var(--accent); }

.pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  padding: 9px 16px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg);
  font-size: 13.5px; font-weight: 600; transition: all 0.18s; color: var(--text);
}
.pill.active { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.pill.font-serif { font-family: 'Noto Serif','Nanum Myeongjo',serif; }
.pill.font-sans { font-family: var(--ui-font); }

.theme-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
.theme-chip { aspect-ratio: 1; border-radius: 13px; border: 2.5px solid transparent; position: relative; transition: transform 0.12s, border-color 0.2s; overflow: hidden; }
.theme-chip:active { transform: scale(0.92); }
.theme-chip.active { border-color: var(--accent); }
.theme-chip.active::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; }
.tc-sepia { background: #f3ebdd; } .tc-sepia.active::after { color: #9b6f2f; }
.tc-light { background: #fbfaf8; border: 2.5px solid #e0ddd6; } .tc-light.active { border-color: var(--accent); } .tc-light.active::after { color: #486582; }
.tc-dark { background: #1d1b18; } .tc-dark.active::after { color: #c9a55c; }
.tc-night { background: #000; } .tc-night.active::after { color: #b89a5a; }
.tc-green { background: #e3ead9; } .tc-green.active::after { color: #5d7239; }

/* 슬라이더 */
.slider-wrap { display: flex; align-items: center; gap: 13px; padding: 4px 0; }
.slider-wrap svg { width: 19px; height: 19px; stroke: var(--muted); fill: none; stroke-width: 1.8; flex-shrink: 0; }
input[type=range] {
  -webkit-appearance: none; appearance: none; flex: 1; height: 5px; border-radius: 3px;
  background: var(--surface-2); outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 2px 7px var(--shadow); cursor: pointer;
}
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: none; }

/* 목차 / 북마크 리스트 */
.list-item {
  display: flex; align-items: center; gap: 12px; padding: 13px 12px; border-radius: 12px;
  transition: background 0.15s; cursor: pointer; margin-bottom: 2px;
}
.list-item:active { background: var(--surface-2); }
.li-idx { font-size: 11px; font-weight: 700; color: var(--accent); min-width: 30px; flex-shrink: 0; opacity: 0.7; }
.li-body { flex: 1; min-width: 0; }
.li-title { font-size: 14.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-del { width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.li-del:active { background: var(--surface-2); }
.li-del svg { width: 16px; height: 16px; stroke: #c0392b; fill: none; stroke-width: 2.2; }
.list-empty { text-align: center; padding: 44px 20px; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
.list-empty .le-icon { font-size: 34px; margin-bottom: 12px; opacity: 0.45; }

/* 검색 */
.search-box { position: relative; margin-bottom: 16px; }
#search-input {
  width: 100%; padding: 13px 44px 13px 16px; border-radius: 13px; border: 1.5px solid var(--border);
  background: var(--bg); font-size: 15px; color: var(--text); font-family: var(--ui-font); outline: none; transition: border-color 0.2s;
}
#search-input:focus { border-color: var(--accent); }
.search-go { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 9px; border: none; background: var(--accent); display: flex; align-items: center; justify-content: center; }
.search-go svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2.2; }
#search-count { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.search-result { padding: 12px; border-radius: 11px; margin-bottom: 6px; cursor: pointer; transition: background 0.15s; border: 1px solid var(--border); }
.search-result:active { background: var(--surface-2); }
.sr-text { font-size: 13.5px; line-height: 1.6; color: var(--text); }
.sr-text mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: var(--accent); font-weight: 700; padding: 0 2px; border-radius: 2px; }
.sr-pct { font-size: 11px; color: var(--accent); font-weight: 600; margin-top: 5px; }

/* 로딩 */
#loading { display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
#loading.show { display: flex; }
.spinner { width: 38px; height: 38px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-msg { font-size: 13.5px; color: var(--muted); letter-spacing: 0.02em; }

/* 밝기 오버레이 */
#brightness-veil { position: fixed; inset: 0; background: #000; pointer-events: none; z-index: 320; opacity: 0; transition: opacity 0.3s; }

/* 토스트 */
#toast {
  position: fixed; bottom: calc(env(safe-area-inset-bottom) + 80px); left: 50%; transform: translateX(-50%) translateY(20px);

<script>
'use strict';

/* ════════════════════ IndexedDB (책 본문 저장) ════════════════════ */
const DB = (() => {
  let db = null;
  function open() {
    return new Promise((resolve, reject) => {
      if (db) return resolve(db);
      const req = indexedDB.open('NovelReaderDB', 1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('books')) d.createObjectStore('books', { keyPath: 'id' });
      };
      req.onsuccess = e => { db = e.target.result; resolve(db); };
      req.onerror = e => reject(e.target.error);
    });
  }
  async function put(id, content) {
    const d = await open();
    return new Promise((resolve, reject) => {
      const tx = d.transaction('books', 'readwrite');
      tx.objectStore('books').put({ id, content });
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e.target.error);
    });
  }
  async function get(id) {
    const d = await open();
    return new Promise((resolve, reject) => {
      const req = d.transaction('books', 'readonly').objectStore('books').get(id);
      req.onsuccess = () => resolve(req.result ? req.result.content : null);
      req.onerror = e => reject(e.target.error);
    });
  }
  async function del(id) {
    const d = await open();
    return new Promise((resolve, reject) => {
      const tx = d.transaction('books', 'readwrite');
      tx.objectStore('books').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e.target.error);
    });
  }
  return { put, get, del };
})();

/* ════════════════════ 메타데이터 (localStorage) ════════════════════ */
const Meta = {
  books() { try { return JSON.parse(localStorage.getItem('nr-books') || '{}'); } catch(e) { return {}; } },
  saveBooks(b) { try { localStorage.setItem('nr-books', JSON.stringify(b)); } catch(e) {} },
  cfg() {
    const def = { font: 19, line: 2.0, pad: 16, gap: 0.9, fontFamily: 'serif', weight: 400, theme: 'sepia', brightness: 0, asSpeed: 3 };
    try { return Object.assign(def, JSON.parse(localStorage.getItem('nr-cfg') || '{}')); } catch(e) { return def; }
  },
  saveCfg(c) { try { localStorage.setItem('nr-cfg', JSON.stringify(c)); } catch(e) {} },
  lastBook() { try { return localStorage.getItem('nr-last') || null; } catch(e) { return null; } },
  setLast(id) { try { id ? localStorage.setItem('nr-last', id) : localStorage.removeItem('nr-last'); } catch(e) {} }
};

/* ════════════════════ 상태 ════════════════════ */
let cfg = Meta.cfg();
let curBook = null;          // { id, name }
let chapters = [];           // [{ idx, title, top }]
let paragraphs = [];         // 원본 단락 배열
let uiVisible = true, sheetOpen = false, lastTap = 0;
let scrollSaveTimer = null, autoScrollRAF = null, autoScrolling = false;
let searchHitEls = [];
let pendingRestore = null;
const TOP_OFFSET = 64;

/* ════════════════════ 설정 적용 ════════════════════ */
function applyCfg() {
  const r = document.documentElement;
  r.style.setProperty('--font-size', cfg.font + 'px');
  r.style.setProperty('--line-height', cfg.line);
  r.style.setProperty('--side-pad', cfg.pad + 'px');
  r.style.setProperty('--para-gap', cfg.gap + 'em');
  r.style.setProperty('--font-weight', cfg.weight);
  r.style.setProperty('--body-font', cfg.fontFamily === 'sans'
    ? "-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"
    : "'Noto Serif','Nanum Myeongjo','Batang',serif");
  document.body.removeAttribute('data-theme');
  if (cfg.theme !== 'sepia') document.body.setAttribute('data-theme', cfg.theme);
  document.getElementById('brightness-veil').style.opacity = cfg.brightness / 100;
  document.querySelector('meta[name=theme-color]').setAttribute('content',
    getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#9b6f2f');
  // UI 동기화
  setText('v-font', cfg.font); setText('v-line', cfg.line.toFixed(1));
  setText('v-pad', cfg.pad); setText('v-gap', cfg.gap.toFixed(1));
  setText('as-speed', cfg.asSpeed);
  document.getElementById('brightness-slider').value = cfg.brightness;
  document.querySelectorAll('[data-font]').forEach(b => b.classList.toggle('active', b.dataset.font === cfg.fontFamily));
  document.querySelectorAll('[data-weight]').forEach(b => b.classList.toggle('active', +b.dataset.weight === cfg.weight));
  document.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('active', b.dataset.theme === cfg.theme));
}
function setText(id, t) { const el = document.getElementById(id); if (el) el.textContent = t; }
function saveCfg() { Meta.saveCfg(cfg); }

/* ════════════════════ 유틸 ════════════════════ */
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function fileId(name, size) { return 'b_' + name.replace(/[^a-zA-Z0-9가-힣]/g, '_') + '_' + size; }
function timeAgo(ts) {
  const d = Date.now() - ts, m = 60000, h = 3600000, day = 86400000;
  if (d < m) return '방금'; if (d < h) return Math.floor(d/m) + '분 전';
  if (d < day) return Math.floor(d/h) + '시간 전'; if (d < day*30) return Math.floor(d/day) + '일 전';
  return new Date(ts).toLocaleDateString('ko-KR', { month:'long', day:'numeric' });
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ════════════════════ 챕터 감지 ════════════════════ */
const CH_RE = /^\s*(?:(?:제\s*)?\d+\s*[장화권부편회막](?=[\s:.·\-—~!?]|$)|[一二三四五六七八九十百千]+\s*[장화권부편회막](?=[\s:.·\-—~!?]|$)|프롤로그|에필로그|서장|종장|서막|종막|외전|번외)\s*.{0,40}$|^\s*(?:[Cc]hapter|CHAPTER|[Pp]rologue|PROLOGUE|[Ee]pilogue|EPILOGUE|PART|Part)\b.{0,40}$/;
function isChapter(line) {
  const t = line.trim();
  if (!t || t.length > 50) return false;
  return CH_RE.test(t);
}

/* ════════════════════ 서재 렌더 ════════════════════ */
function renderLibrary() {
  const books = Meta.books();
  const ids = Object.keys(books).sort((a, b) => (books[b].lastRead || 0) - (books[a].lastRead || 0));
  const grid = document.getElementById('book-grid');
  const empty = document.getElementById('empty-state');
  const cont = document.getElementById('continue-card');

  // 이어읽기 카드
  const lastId = Meta.lastBook();
  if (lastId && books[lastId]) {
    const b = books[lastId];
    setText('cc-title', b.name.replace(/\.txt$/i, ''));
    document.getElementById('cc-fill').style.width = (b.progress || 0) + '%';
    setText('cc-pct', (b.progress || 0) + '% 읽음 · ' + timeAgo(b.lastRead || Date.now()));
    cont.style.display = 'block';
    cont.onclick = () => openBook(lastId);
  } else {
    cont.style.display = 'none';
  }

  if (ids.length === 0) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  grid.innerHTML = ids.map(id => {
    const b = books[id];
    const title = escHtml(b.name.replace(/\.txt$/i, ''));
    return `<div class="book-card" data-id="${id}">
      <button class="book-del" data-del="${id}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="book-cover">
        <div class="book-spine"></div>
        <div class="book-cover-title">${title}</div>
        <div class="book-cover-icon"><svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h6v16H5a1 1 0 0 1-1-1V5zM20 5a1 1 0 0 0-1-1h-6v16h6a1 1 0 0 0 1-1V5z"/></svg></div>
      </div>
      <div class="book-info">
        <div class="book-meta"><span>${b.progress || 0}%</span><span>${timeAgo(b.lastRead || Date.now())}</span></div>
        <div class="book-prog-bar"><div class="book-prog-fill" style="width:${b.progress || 0}%"></div></div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.book-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.book-del')) return;
      if (card.classList.contains('editing')) { card.classList.remove('editing'); return; }
      openBook(card.dataset.id);
    });
    let pressTimer;
    card.addEventListener('touchstart', () => { pressTimer = setTimeout(() => card.classList.add('editing'), 550); }, { passive: true });
    card.addEventListener('touchend', () => clearTimeout(pressTimer));
    card.addEventListener('touchmove', () => clearTimeout(pressTimer));
    card.addEventListener('contextmenu', e => { e.preventDefault(); card.classList.add('editing'); });
  });
  grid.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); deleteBook(btn.dataset.del); });
  });
}

async function deleteBook(id) {
  const books = Meta.books();
  const name = books[id] ? books[id].name.replace(/\.txt$/i, '') : '';
  if (!confirm(`"${name}"을(를) 서재에서 삭제할까요?`)) return;
  delete books[id];
  Meta.saveBooks(books);
  if (Meta.lastBook() === id) Meta.setLast(null);
  try { await DB.del(id); } catch(e) {}
  renderLibrary();
  toast('삭제되었어요');
}

/* ════════════════════ 파일 열기 ════════════════════ */
document.getElementById('file-input').addEventListener('change', function(e) {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const mb = (f.size / 1048576).toFixed(1);
  showLoading(`${f.name} (${mb}MB)`);
  setTimeout(() => {
    const reader = new FileReader();
    reader.onload = async ev => {
      const id = fileId(f.name, f.size);
      const content = ev.target.result;
      try { await DB.put(id, content); } catch(err) { toast('저장 공간 부족'); }
      const books = Meta.books();
      if (!books[id]) books[id] = { name: f.name, pos: 0, progress: 0, lastRead: Date.now(), bookmarks: [], size: f.size };
      else books[id].lastRead = Date.now();
      Meta.saveBooks(books);
      loadContent(id, f.name, content);
    };
    reader.onerror = () => { hideLoading(); toast('파일을 읽을 수 없어요'); };
    reader.readAsText(f, 'UTF-8');
  }, 40);
});

async function openBook(id) {
  const books = Meta.books();
  if (!books[id]) { toast('책을 찾을 수 없어요'); return; }
  showLoading(books[id].name);
  const content = await DB.get(id);
  if (content == null) {
    hideLoading();
    if (confirm('저장된 본문이 없어요. 파일을 다시 불러올까요?')) document.getElementById('file-input').click();
    return;
  }
  setTimeout(() => loadContent(id, books[id].name, content), 30);
}

function loadContent(id, name, raw) {
  curBook = { id, name };
  Meta.setLast(id);
  setText('book-title', name.replace(/\.txt$/i, ''));

  paragraphs = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n{2,}/);
  chapters = [];
  const disp = document.getElementById('text-display');
  disp.innerHTML = '';

  // 서재 → 리더 전환
  document.getElementById('library').style.display = 'none';
  document.getElementById('reader').classList.add('show');
  document.getElementById('toolbar').classList.add('show');
  document.getElementById('status-bar').classList.add('show');
  showUI();

  // 청크 렌더링
  const CHUNK = 200;
  let idx = 0, restored = false, pIndex = 0;
  function chunk() {
    const frag = document.createDocumentFragment();
    const end = Math.min(idx + CHUNK, paragraphs.length);
    for (let i = idx; i < end; i++) {
      const lines = paragraphs[i].split('\n').map(l => l.trim()).filter(Boolean);
      const p = document.createElement('p');
      p.id = 'p' + i;
      if (!lines.length) { p.className = 'blank'; }
      else {
        const first = lines[0];
        if (lines.length === 1 && isChapter(first)) {
          p.className = 'chapter';
          p.textContent = first;
          chapters.push({ pid: 'p' + i, title: first });
        } else {
          p.innerHTML = lines.map(escHtml).join('<br>');
        }
      }
      frag.appendChild(p);
    }
    disp.appendChild(frag);
    idx = end;

    if (!restored && idx >= Math.min(CHUNK, paragraphs.length)) {
      restored = true;
      hideLoading();
      const savedPos = (Meta.books()[id] || {}).pos;
      const targetIdx = (savedPos && typeof savedPos === 'object') ? savedPos.pIdx : (typeof savedPos === 'number' ? -1 : 0);
      if (targetIdx >= 0 && targetIdx < idx) {
        setTimeout(() => restorePosition(savedPos), 60);  // 첫 청크 안 → 즉시
      } else if (typeof savedPos === 'number') {
        setTimeout(() => restorePosition(savedPos), 60);  // 구버전 픽셀값
      } else {
        pendingRestore = savedPos;  // 멀리 있음 → 전체 렌더 후 복원
      }
    }
    if (idx < paragraphs.length) {
      (window.requestIdleCallback || (cb => setTimeout(cb, 0)))(chunk, { timeout: 200 });
    } else {
      if (pendingRestore) { restorePosition(pendingRestore); pendingRestore = null; }
      buildTOC();
      updateProgress();
    }
  }
  requestAnimationFrame(chunk);
  closeSheet();
  switchTab('settings');
}

/* ════════════════════ 목차 ════════════════════ */
function buildTOC() {
  const list = document.getElementById('toc-list');
  if (chapters.length === 0) {
    list.innerHTML = `<div class="list-empty"><div class="le-icon">📖</div>이 책에서는 목차를<br>자동으로 찾지 못했어요</div>`;
    return;
  }
  list.innerHTML = chapters.map((c, i) =>
    `<div class="list-item" data-pid="${c.pid}"><span class="li-idx">${i+1}</span><div class="li-body"><div class="li-title">${escHtml(c.title)}</div></div></div>`
  ).join('');
  list.querySelectorAll('.list-item').forEach(el => {
    el.addEventListener('click', () => { jumpTo(el.dataset.pid); closeSheet(); });
  });
}
function jumpTo(pid) {
  const el = document.getElementById(pid);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}

/* ════════════════════ 북마크 ════════════════════ */
document.getElementById('btn-bookmark').addEventListener('click', toggleBookmark);
function toggleBookmark() {
  if (!curBook) return;
  const books = Meta.books();
  const b = books[curBook.id];
  if (!b) return;
  b.bookmarks = b.bookmarks || [];
  const pos = capturePosition();
  const pct = pos.pct;
  const preview = previewAtScroll();
  b.bookmarks.unshift({ pos: { pIdx: pos.pIdx, offset: pos.offset }, pct, text: preview, time: Date.now() });
  if (b.bookmarks.length > 50) b.bookmarks.pop();
  Meta.saveBooks(books);
  renderBookmarks();
  toast('북마크 추가됨 · ' + pct + '%');
  flashBookmarkIcon();
}
function flashBookmarkIcon() {
  const btn = document.getElementById('btn-bookmark');
  btn.classList.add('bookmarked');
  setTimeout(() => btn.classList.remove('bookmarked'), 700);
}
function previewAtScroll() {
  const y = window.scrollY + 120;
  const ps = document.querySelectorAll('#text-display p');
  for (const p of ps) {
    if (p.classList.contains('blank')) continue;
    const r = p.getBoundingClientRect();
    const top = r.top + window.scrollY;
    if (top >= y - 80) return (p.textContent || '').slice(0, 60);
  }
  return '';
}
function renderBookmarks() {
  const list = document.getElementById('bookmark-list');
  const b = curBook ? (Meta.books()[curBook.id] || {}) : {};
  const bms = b.bookmarks || [];
  if (bms.length === 0) {
    list.innerHTML = `<div class="list-empty"><div class="le-icon">🔖</div>북마크가 없어요<br>상단 책갈피 아이콘을 눌러 추가하세요</div>`;
    return;
  }
  list.innerHTML = bms.map((bm, i) =>
    `<div class="list-item" data-bmidx="${i}"><span class="li-idx">${bm.pct}%</span>
      <div class="li-body"><div class="li-title">${escHtml(bm.text || '(빈 위치)')}</div><div class="li-sub">${timeAgo(bm.time)}</div></div>
      <button class="li-del" data-bmdel="${i}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`
  ).join('');
  list.querySelectorAll('.list-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.li-del')) return;
      const bm = (Meta.books()[curBook.id].bookmarks || [])[+el.dataset.bmidx];
      if (bm) restorePosition(bm.pos);
      closeSheet();
    });
  });
  list.querySelectorAll('[data-bmdel]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const books = Meta.books(); const bk = books[curBook.id];
      bk.bookmarks.splice(+btn.dataset.bmdel, 1);
      Meta.saveBooks(books); renderBookmarks();
    });
  });
}

/* ════════════════════ 검색 ════════════════════ */
const searchInput = document.getElementById('search-input');
document.getElementById('search-go').addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
function doSearch() {
  const q = searchInput.value.trim();
  const cnt = document.getElementById('search-count');
  const box = document.getElementById('search-results');
  clearSearchHits();
  if (q.length < 1) { cnt.textContent = ''; box.innerHTML = ''; return; }
  const re = new RegExp(escReg(q), 'gi');
  const results = [];
  for (let i = 0; i < paragraphs.length && results.length < 200; i++) {
    const txt = paragraphs[i].replace(/\n/g, ' ');
    if (re.test(txt)) {
      re.lastIndex = 0;
      const m = txt.search(re);
      const start = Math.max(0, m - 18);
      const snippet = (start > 0 ? '…' : '') + txt.slice(start, m + q.length + 42) + '…';
      results.push({ pid: 'p' + i, snippet });
    }
    re.lastIndex = 0;
  }
  cnt.textContent = results.length ? `${results.length}개 발견` : '결과 없음';
  box.innerHTML = results.map(r => {
    const hl = escHtml(r.snippet).replace(new RegExp(escReg(escHtml(q)), 'gi'), m => `<mark>${m}</mark>`);
    return `<div class="search-result" data-pid="${r.pid}"><div class="sr-text">${hl}</div></div>`;
  }).join('');
  box.querySelectorAll('.search-result').forEach(el => {
    el.addEventListener('click', () => {
      const pid = el.dataset.pid;
      highlightHit(pid);
      jumpTo(pid); closeSheet();
    });
  });
}
function highlightHit(pid) {
  clearSearchHits();
  const el = document.getElementById(pid);
  if (!el) return;
  el.classList.add('search-hit');
  searchHitEls.push(el);
  setTimeout(clearSearchHits, 3000);
}
function clearSearchHits() { searchHitEls.forEach(el => el.classList.remove('search-hit')); searchHitEls = []; }

/* ════════════════════ 진행률 / 위치 저장 ════════════════════ */
// content-visibility 환경에서도 정확한 단락 기반 위치 캡처/복원
function capturePosition() {
  const ps = document.querySelectorAll('#text-display p');
  const anchor = window.scrollY + TOP_OFFSET;
  for (let i = 0; i < ps.length; i++) {
    const r = ps[i].getBoundingClientRect();
    const top = r.top + window.scrollY;
    if (top + r.height > anchor) {
      const idNum = parseInt(ps[i].id.slice(1), 10);
      return { pIdx: isNaN(idNum) ? 0 : idNum, offset: Math.max(0, Math.round(anchor - top)), pct: curPct() };
    }
  }
  return { pIdx: 0, offset: 0, pct: curPct() };
}
function restorePosition(pos) {
  if (pos == null) { window.scrollTo(0, 0); return; }
  if (typeof pos === 'number') { window.scrollTo(0, pos); return; } // 구버전 호환
  const el = document.getElementById('p' + pos.pIdx);
  if (!el) { window.scrollTo(0, 0); return; }
  const top = el.getBoundingClientRect().top + window.scrollY;
  window.scrollTo(0, Math.max(0, top + (pos.offset || 0) - TOP_OFFSET));
}

function curPct() {
  const total = document.documentElement.scrollHeight - window.innerHeight;
  return total > 0 ? Math.round(window.scrollY / total * 100) : 0;
}
function curChapterTitle() {
  if (!chapters.length) return '';
  const y = window.scrollY + 80;
  let cur = '';
  for (const c of chapters) {
    const el = document.getElementById(c.pid);
    if (!el) continue;
    if (el.getBoundingClientRect().top + window.scrollY <= y) cur = c.title; else break;
  }
  return cur;
}
function updateProgress() {
  const total = document.documentElement.scrollHeight - window.innerHeight;
  const ratio = total > 0 ? window.scrollY / total : 0;
  document.getElementById('progress-bar').style.transform = `scaleX(${ratio})`;
  setText('pct-now', Math.round(ratio * 100) + '%');
  const ch = curChapterTitle();
  setText('chapter-now', ch);
}
function saveScrollPos() {
  if (!curBook) return;
  const books = Meta.books();
  const b = books[curBook.id];
  if (!b) return;
  const p = capturePosition();
  b.pos = { pIdx: p.pIdx, offset: p.offset };
  b.progress = p.pct;
  b.lastRead = Date.now();
  Meta.saveBooks(books);
}

window.addEventListener('scroll', () => {
  if (!curBook) return;
  updateProgress();
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(saveScrollPos, 350);
}, { passive: true });

// 앱 종료/백그라운드 → 즉시 저장 (핵심)
function saveNow() { if (curBook) saveScrollPos(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveNow(); stopAutoScroll(); } });
window.addEventListener('pagehide', saveNow);
window.addEventListener('beforeunload', saveNow);
window.addEventListener('blur', saveNow);

/* ════════════════════ 자동 스크롤 ════════════════════ */
function startAutoScroll() {
  if (autoScrolling) return;
  autoScrolling = true;
  document.getElementById('autoscroll-ind').classList.add('show');
  setText('autoscroll-toggle', '중지');
  document.getElementById('autoscroll-toggle').classList.add('active');
  let acc = 0;
  function step() {
    if (!autoScrolling) return;
    acc += cfg.asSpeed * 0.45;
    if (acc >= 1) { window.scrollBy(0, acc); acc = 0; }
    if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2) { stopAutoScroll(); return; }
    autoScrollRAF = requestAnimationFrame(step);
  }
  autoScrollRAF = requestAnimationFrame(step);
}
function stopAutoScroll() {
  if (!autoScrolling) return;
  autoScrolling = false;
  cancelAnimationFrame(autoScrollRAF);
  document.getElementById('autoscroll-ind').classList.remove('show');
  setText('autoscroll-toggle', '시작');
  document.getElementById('autoscroll-toggle').classList.remove('active');
}
document.getElementById('autoscroll-toggle').addEventListener('click', () => {
  if (autoScrolling) stopAutoScroll(); else { startAutoScroll(); closeSheet(); }
});
document.getElementById('as-stop').addEventListener('click', stopAutoScroll);
document.getElementById('as-slower').addEventListener('click', () => { cfg.asSpeed = Math.max(1, cfg.asSpeed - 1); setText('as-speed', cfg.asSpeed); saveCfg(); });
document.getElementById('as-faster').addEventListener('click', () => { cfg.asSpeed = Math.min(10, cfg.asSpeed + 1); setText('as-speed', cfg.asSpeed); saveCfg(); });

/* ════════════════════ UI 토글 (탭) ════════════════════ */
function showUI() {
  uiVisible = true;
  document.getElementById('toolbar').classList.remove('hide');
  document.getElementById('status-bar').classList.remove('hide');
}
function hideUI() {
  uiVisible = false;
  document.getElementById('toolbar').classList.add('hide');
  document.getElementById('status-bar').classList.add('hide');
}
document.addEventListener('click', e => {
  if (!document.getElementById('reader').classList.contains('show')) return;
  if (e.target.closest('#toolbar, #sheet, #overlay, #autoscroll-ind, button, input, a')) return;
  const now = Date.now();
  if (now - lastTap < 280) return;
  lastTap = now;
  if (sheetOpen) { closeSheet(); return; }
  if (autoScrolling) { stopAutoScroll(); return; }
  uiVisible ? hideUI() : showUI();
});

/* ════════════════════ 시트 ════════════════════ */
function openSheet() {
  sheetOpen = true;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('overlay').classList.add('show');
  showUI();
}
function closeSheet() {
  sheetOpen = false;
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  searchInput.blur();
}
function switchTab(name) {
  document.querySelectorAll('.sheet-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
  if (name === 'toc') buildTOC();
  if (name === 'bookmarks') renderBookmarks();
  if (name === 'search') setTimeout(() => searchInput.focus(), 250);
}
document.getElementById('btn-menu').addEventListener('click', e => { e.stopPropagation(); openSheet(); switchTab('settings'); });
document.getElementById('overlay').addEventListener('click', closeSheet);
document.querySelectorAll('.sheet-tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

/* ════════════════════ 설정 컨트롤 ════════════════════ */
document.querySelectorAll('.step-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const a = btn.dataset.act;
    if (a === 'font+') cfg.font = Math.min(40, cfg.font + 1);
    else if (a === 'font-') cfg.font = Math.max(8, cfg.font - 1);
    else if (a === 'line+') cfg.line = Math.min(3.5, Math.round((cfg.line + 0.1)*10)/10);
    else if (a === 'line-') cfg.line = Math.max(1.2, Math.round((cfg.line - 0.1)*10)/10);
    else if (a === 'pad+') cfg.pad = Math.min(80, cfg.pad + 4);
    else if (a === 'pad-') cfg.pad = Math.max(0, cfg.pad - 4);
    else if (a === 'gap+') cfg.gap = Math.min(2.5, Math.round((cfg.gap + 0.1)*10)/10);
    else if (a === 'gap-') cfg.gap = Math.max(0, Math.round((cfg.gap - 0.1)*10)/10);
    applyCfg(); saveCfg();
  });
});
document.querySelectorAll('[data-font]').forEach(b => b.addEventListener('click', () => { cfg.fontFamily = b.dataset.font; applyCfg(); saveCfg(); }));
document.querySelectorAll('[data-weight]').forEach(b => b.addEventListener('click', () => { cfg.weight = +b.dataset.weight; applyCfg(); saveCfg(); }));
document.querySelectorAll('[data-theme]').forEach(b => b.addEventListener('click', () => { cfg.theme = b.dataset.theme; applyCfg(); saveCfg(); }));
document.getElementById('brightness-slider').addEventListener('input', e => {
  cfg.brightness = +e.target.value;
  document.getElementById('brightness-veil').style.opacity = cfg.brightness / 100;
});
document.getElementById('brightness-slider').addEventListener('change', saveCfg);

/* ════════════════════ 서재 복귀 ════════════════════ */
document.getElementById('btn-home').addEventListener('click', () => {
  saveNow(); stopAutoScroll(); closeSheet();
  curBook = null;
  document.getElementById('reader').classList.remove('show');
  document.getElementById('toolbar').classList.remove('show');
  document.getElementById('status-bar').classList.remove('show');
  document.getElementById('progress-bar').style.transform = 'scaleX(0)';
  document.getElementById('library').style.display = 'block';
  window.scrollTo(0, 0);
  renderLibrary();
});

/* 파일 추가 버튼들 */
['add-btn-top', 'add-btn-empty'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('click', () => document.getElementById('file-input').click());
});

/* ════════════════════ 로딩 ════════════════════ */
function showLoading(name) { setText('loading-msg', name + ' 불러오는 중...'); document.getElementById('loading').classList.add('show'); }
function hideLoading() { document.getElementById('loading').classList.remove('show'); }

/* ════════════════════ Service Worker ════════════════════ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

/* ════════════════════ 초기화 ════════════════════ */
applyCfg();
renderLibrary();
</script>
